<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep midnight -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1035"/>
      <stop offset="60%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#050310"/>
    </radialGradient>

    <!-- Jade glow for the orb -->
    <radialGradient id="orbGrad" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#aafff0"/>
      <stop offset="30%" stop-color="#16d4a0"/>
      <stop offset="65%" stop-color="#0a8c62"/>
      <stop offset="100%" stop-color="#054030"/>
    </radialGradient>

    <!-- Gold ring gradient -->
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffe580"/>
      <stop offset="25%"  stop-color="#f0c040"/>
      <stop offset="50%"  stop-color="#e7a820"/>
      <stop offset="75%"  stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#ffe580"/>
    </linearGradient>

    <!-- Shimmer gradient for figure -->
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#fffbe0"/>
      <stop offset="40%"  stop-color="#f0c040"/>
      <stop offset="100%" stop-color="#a07010"/>
    </linearGradient>

    <!-- Outer glow filter -->
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComposite in2="SourceGraphic" operator="arithmetic" k2="-1" k3="1"/>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">

    <!-- ── BACKGROUND ── -->
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>

    <!-- Star field -->
    <g opacity="0.6">
      <circle cx="120" cy="80"  r="1.8" fill="#fff" opacity="0.9"/>
      <circle cx="280" cy="140" r="1.2" fill="#fff" opacity="0.7"/>
      <circle cx="420" cy="55"  r="2"   fill="#fff" opacity="0.8"/>
      <circle cx="600" cy="90"  r="1.5" fill="#fff" opacity="0.6"/>
      <circle cx="750" cy="60"  r="1.8" fill="#fff" opacity="0.9"/>
      <circle cx="890" cy="130" r="1.2" fill="#fff" opacity="0.7"/>
      <circle cx="950" cy="70"  r="2"   fill="#fff" opacity="0.5"/>
      <circle cx="60"  cy="200" r="1.5" fill="#fff" opacity="0.6"/>
      <circle cx="180" cy="300" r="1"   fill="#fff" opacity="0.5"/>
      <circle cx="820" cy="220" r="1.5" fill="#fff" opacity="0.7"/>
      <circle cx="970" cy="260" r="1"   fill="#fff" opacity="0.6"/>
      <circle cx="340" cy="180" r="1.2" fill="#c8f0ff" opacity="0.5"/>
      <circle cx="680" cy="150" r="1.5" fill="#c8f0ff" opacity="0.6"/>
    </g>

    <!-- ── BACKGROUND MOUNTAIN SILHOUETTE ── -->
    <g opacity="0.18">
      <!-- Mountains -->
      <polygon points="0,820 180,480 360,820" fill="#2a1860"/>
      <polygon points="120,820 340,400 560,820" fill="#1e1050"/>
      <polygon points="350,820 512,350 674,820" fill="#2a1860"/>
      <polygon points="500,820 700,420 900,820" fill="#1e1050"/>
      <polygon points="720,820 900,460 1024,680 1024,820" fill="#2a1860"/>
    </g>

    <!-- ── RAYS OF LIGHT (behind orb) ── -->
    <g opacity="0.12" filter="url(#softGlow)">
      <line x1="512" y1="512" x2="512" y2="50"  stroke="#16d4a0" stroke-width="60"/>
      <line x1="512" y1="512" x2="100" y2="200" stroke="#16d4a0" stroke-width="40"/>
      <line x1="512" y1="512" x2="924" y2="200" stroke="#16d4a0" stroke-width="40"/>
      <line x1="512" y1="512" x2="50"  y2="512" stroke="#16d4a0" stroke-width="30"/>
      <line x1="512" y1="512" x2="974" y2="512" stroke="#16d4a0" stroke-width="30"/>
      <line x1="512" y1="512" x2="150" y2="850" stroke="#f0c040" stroke-width="25"/>
      <line x1="512" y1="512" x2="874" y2="850" stroke="#f0c040" stroke-width="25"/>
    </g>

    <!-- ── OUTER GOLD DECORATIVE RING ── -->
    <circle cx="512" cy="500" r="390" fill="none" stroke="url(#goldRing)" stroke-width="3" opacity="0.5"/>
    <circle cx="512" cy="500" r="410" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.3"/>

    <!-- Gold ring tick marks -->
    <g stroke="url(#goldRing)" stroke-width="3" opacity="0.6">
      <line x1="512" y1="95"  x2="512" y2="75"  transform="rotate(0 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(30 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(60 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="75"  transform="rotate(90 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(120 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(150 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="75"  transform="rotate(180 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(210 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(240 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="75"  transform="rotate(270 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(300 512 500)"/>
      <line x1="512" y1="95"  x2="512" y2="80"  transform="rotate(330 512 500)"/>
    </g>

    <!-- ── JADE ENERGY ORB (main glow sphere) ── -->
    <!-- Glow halo behind orb -->
    <circle cx="512" cy="480" r="260" fill="#16d4a0" opacity="0.08" filter="url(#softGlow)"/>
    <circle cx="512" cy="480" r="200" fill="#16d4a0" opacity="0.12" filter="url(#glowGreen)"/>

    <!-- Main orb -->
    <circle cx="512" cy="480" r="190" fill="url(#orbGrad)" filter="url(#glowGreen)"/>

    <!-- Orb inner highlight -->
    <ellipse cx="468" cy="410" rx="80" ry="55" fill="#ffffff" opacity="0.22"/>
    <ellipse cx="455" cy="400" rx="35" ry="22" fill="#ffffff" opacity="0.35"/>

    <!-- Orb dark lower rim (depth) -->
    <circle cx="512" cy="480" r="190" fill="none" stroke="#054030" stroke-width="2" opacity="0.5"/>

    <!-- ── YIN-YANG INSIDE THE ORB ── -->
    <g filter="url(#glowGold)" opacity="0.92">
      <!-- Yin-Yang symbol centered at 512,480, radius ~85 -->
      <!-- Dark half (top) -->
      <path d="M512,395 A85,85 0 0,1 512,565 A42.5,42.5 0 0,1 512,480 A42.5,42.5 0 0,0 512,395 Z" fill="#0d2820"/>
      <!-- Light half (bottom) -->
      <path d="M512,395 A85,85 0 0,0 512,565 A42.5,42.5 0 0,0 512,480 A42.5,42.5 0 0,1 512,395 Z" fill="#f0f8f4"/>
      <!-- Top small circle (light dot in dark) -->
      <circle cx="512" cy="437.5" r="20" fill="#aafff0"/>
      <!-- Bottom small circle (dark dot in light) -->
      <circle cx="512" cy="522.5" r="20" fill="#0d2820"/>
      <!-- Outer ring -->
      <circle cx="512" cy="480" r="85" fill="none" stroke="url(#goldRing)" stroke-width="4"/>
    </g>

    <!-- ── MEDITATING FIGURE (silhouette above orb) ── -->
    <g filter="url(#glowGold)">
      <!-- Body glow -->
      <ellipse cx="512" cy="282" rx="55" ry="80" fill="#f0c040" opacity="0.15" filter="url(#softGlow)"/>

      <!-- Seated body -->
      <!-- Crossed legs base -->
      <ellipse cx="512" cy="340" rx="62" ry="22" fill="url(#figureGrad)" opacity="0.95"/>
      <!-- Left leg curve -->
      <path d="M450,348 Q430,360 448,370 Q470,358 512,355" fill="url(#figureGrad)" opacity="0.9"/>
      <!-- Right leg curve -->
      <path d="M574,348 Q594,360 576,370 Q554,358 512,355" fill="url(#figureGrad)" opacity="0.9"/>

      <!-- Torso -->
      <path d="M478,340 Q476,290 512,268 Q548,290 546,340 Z" fill="url(#figureGrad)" opacity="0.95"/>

      <!-- Left arm resting -->
      <path d="M480,320 Q460,335 455,348" fill="none" stroke="url(#figureGrad)" stroke-width="12" stroke-linecap="round"/>
      <!-- Right arm resting -->
      <path d="M544,320 Q564,335 569,348" fill="none" stroke="url(#figureGrad)" stroke-width="12" stroke-linecap="round"/>

      <!-- Head -->
      <circle cx="512" cy="248" r="34" fill="url(#figureGrad)" opacity="0.98"/>
      <!-- Hair/topknot -->
      <ellipse cx="512" cy="218" rx="14" ry="20" fill="#f0c040"/>
      <ellipse cx="512" cy="210" rx="8" ry="10" fill="#ffe580"/>

      <!-- Face highlight -->
      <ellipse cx="505" cy="244" rx="8" ry="6" fill="#fffbe0" opacity="0.5"/>

      <!-- Halo ring around head -->
      <circle cx="512" cy="248" r="46" fill="none" stroke="url(#goldRing)" stroke-width="2.5" opacity="0.8"/>
      <circle cx="512" cy="248" r="52" fill="none" stroke="url(#goldRing)" stroke-width="1" opacity="0.4"/>
    </g>

    <!-- ── ENERGY PARTICLES floating up ── -->
    <g opacity="0.7" filter="url(#glowGreen)">
      <circle cx="460" cy="200" r="4" fill="#aafff0" opacity="0.8"/>
      <circle cx="490" cy="160" r="3" fill="#f0c040" opacity="0.9"/>
      <circle cx="535" cy="175" r="5" fill="#aafff0" opacity="0.7"/>
      <circle cx="558" cy="210" r="3" fill="#f0c040" opacity="0.8"/>
      <circle cx="440" cy="245" r="2.5" fill="#aafff0" opacity="0.6"/>
      <circle cx="582" cy="240" r="2.5" fill="#aafff0" opacity="0.6"/>
      <circle cx="508" cy="140" r="2" fill="#ffe580" opacity="0.7"/>
    </g>

    <!-- ── BOTTOM TEXT BANNER ── -->
    <!-- Banner background -->
    <rect x="112" y="810" width="800" height="145" rx="16" fill="#0d0820" opacity="0.75"/>
    <rect x="112" y="810" width="800" height="145" rx="16" fill="none" stroke="url(#goldRing)" stroke-width="2" opacity="0.6"/>

    <!-- Title: PATH TO -->
    <text x="512" y="865"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="52" font-weight="bold" letter-spacing="8"
      text-anchor="middle" fill="url(#goldRing)">PATH TO</text>

    <!-- Title: IMMORTALITY -->
    <text x="512" y="930"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="46" font-weight="bold" letter-spacing="4"
      text-anchor="middle" fill="#aafff0">IMMORTALITY</text>

    <!-- ── CORNER DECORATIONS ── -->
    <!-- Top-left -->
    <g opacity="0.5" stroke="url(#goldRing)" stroke-width="2" fill="none">
      <path d="M40,80 L80,40"/>
      <path d="M40,80 L40,110"/>
      <path d="M40,80 L70,80"/>
    </g>
    <!-- Top-right -->
    <g opacity="0.5" stroke="url(#goldRing)" stroke-width="2" fill="none">
      <path d="M984,80 L944,40"/>
      <path d="M984,80 L984,110"/>
      <path d="M984,80 L954,80"/>
    </g>

    <!-- ── VIGNETTE OVERLAY ── -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <rect width="1024" height="1024" fill="url(#vignette)" rx="224"/>

  </g>
</svg>
