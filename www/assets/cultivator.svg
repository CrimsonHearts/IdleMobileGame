<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <clipPath id="cM"><circle cx="180" cy="180" r="176"/></clipPath>
    <radialGradient id="bgM" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#eaf4fb"/><stop offset="0.6" stop-color="#e1edf6"/><stop offset="1" stop-color="#d2e0ec"/>
    </radialGradient>
    <linearGradient id="hairM" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#332a26"/><stop offset="1" stop-color="#1c1714"/>
    </linearGradient>
    <linearGradient id="skinM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d6bf"/><stop offset="1" stop-color="#ecbe9f"/>
    </linearGradient>
    <linearGradient id="robeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6f7e"/><stop offset="1" stop-color="#1c4956"/>
    </linearGradient>
    <radialGradient id="irisM" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#9a7a4e"/><stop offset="0.6" stop-color="#6b4a2c"/><stop offset="1" stop-color="#43301d"/>
    </radialGradient>
    <radialGradient id="gemM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff"/><stop offset="0.5" stop-color="#7fd0e9"/><stop offset="1" stop-color="#1f7e9e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#cM)">
    <rect width="360" height="360" fill="url(#bgM)"/>
    <circle cx="180" cy="150" r="120" fill="#ffffff" opacity="0.35"/>

    <!-- Shoulders / modern jacket -->
    <path d="M92 360 Q102 280 168 264 L180 292 L192 264 Q258 280 268 360 Z" fill="url(#robeM)"/>
    <path d="M150 284 L180 322 L210 284" stroke="#f1d79e" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <path d="M150 284 L180 322 L210 284" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round" opacity="0.4"/>
    <path d="M150 360 Q156 322 150 300 M210 360 Q204 322 210 300" stroke="#143a45" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Neck -->
    <path d="M162 246 L162 288 Q180 300 198 288 L198 246 Z" fill="url(#skinM)"/>
    <path d="M162 252 Q180 270 198 252 L198 260 Q180 276 162 260 Z" fill="#d9a786" opacity="0.5"/>

    <!-- Face (slightly stronger jaw) -->
    <path d="M118 150 Q118 98 180 92 Q242 98 242 150 Q242 198 208 216 Q180 230 152 216 Q118 198 118 150 Z" fill="url(#skinM)"/>
    <ellipse cx="120" cy="158" rx="11" ry="15" fill="url(#skinM)"/><ellipse cx="240" cy="158" rx="11" ry="15" fill="url(#skinM)"/>

    <!-- subtle blush -->
    <ellipse cx="146" cy="178" rx="12" ry="6" fill="#e89a86" opacity="0.28"/>
    <ellipse cx="214" cy="178" rx="12" ry="6" fill="#e89a86" opacity="0.28"/>

    <!-- Eyebrows (bolder) -->
    <path d="M135 134 Q152 128 168 133" stroke="#2a201a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M192 133 Q208 128 225 134" stroke="#2a201a" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <g>
      <ellipse cx="152" cy="153" rx="14" ry="10.5" fill="#fff"/>
      <circle cx="154" cy="154" r="9" fill="url(#irisM)"/><circle cx="154" cy="154" r="4" fill="#221a16"/>
      <circle cx="150" cy="150" r="3.2" fill="#fff"/>
      <path d="M137 148 Q152 139 168 149" stroke="#241a16" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="208" cy="153" rx="14" ry="10.5" fill="#fff"/>
      <circle cx="206" cy="154" r="9" fill="url(#irisM)"/><circle cx="206" cy="154" r="4" fill="#221a16"/>
      <circle cx="202" cy="150" r="3.2" fill="#fff"/>
      <path d="M192 149 Q208 139 223 148" stroke="#241a16" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nose + mouth -->
    <path d="M178 162 Q174 172 182 173" stroke="#d49a7c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M168 190 Q180 196 192 190" stroke="#b9614a" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Hair: short modern with man-bun (full fringe across forehead) -->
    <path d="M113 166 Q103 94 180 85 Q257 94 247 166
             Q239 127 210 119 Q194 111 180 117 Q166 111 150 119 Q121 127 113 166 Z" fill="url(#hairM)"/>
    <path d="M150 120 Q176 108 208 120" stroke="#4a3c33" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round"/>
    <!-- man-bun + band -->
    <circle cx="180" cy="80" r="15" fill="url(#hairM)"/>
    <rect x="167" y="93" width="26" height="6" rx="3" fill="#1c4956"/>
    <!-- short sideburns -->
    <path d="M115 158 Q113 182 122 196 Q127 176 124 160 Z" fill="url(#hairM)"/>
    <path d="M245 158 Q247 182 238 196 Q233 176 236 160 Z" fill="url(#hairM)"/>

    <!-- Glowing dao gem on collar -->
    <circle cx="180" cy="302" r="16" fill="url(#gemM)"/>
    <circle cx="180" cy="302" r="4" fill="#fff"/>
  </g>

  <circle cx="180" cy="180" r="176" fill="none" stroke="#e7c878" stroke-width="3"/>
  <circle cx="180" cy="180" r="170" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
</svg>
