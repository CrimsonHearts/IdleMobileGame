<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <radialGradient id="aura" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#bff7da" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#6fb594" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6fb594" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#46604f"/>
      <stop offset="0.5" stop-color="#324a40"/>
      <stop offset="1" stop-color="#1f2e28"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dea0"/>
      <stop offset="0.5" stop-color="#c8a24a"/>
      <stop offset="1" stop-color="#8a6c2c"/>
    </linearGradient>
    <radialGradient id="dantian" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#fff2c4"/>
      <stop offset="0.7" stop-color="#e7c878"/>
      <stop offset="1" stop-color="#c8a24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mote" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7df"/><stop offset="0.5" stop-color="#9fe3c2" stop-opacity="0.9"/><stop offset="1" stop-color="#9fe3c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>

  <circle cx="180" cy="172" r="172" fill="url(#aura)"/>

  <!-- Orbiting spirit motes -->
  <g filter="url(#glow)">
    <circle cx="338" cy="172" r="7" fill="url(#mote)"/><circle cx="22" cy="172" r="7" fill="url(#mote)"/>
    <circle cx="180" cy="16" r="6" fill="url(#mote)"/><circle cx="180" cy="328" r="6" fill="url(#mote)"/>
    <circle cx="292" cy="62" r="5" fill="url(#mote)"/><circle cx="68" cy="62" r="5" fill="url(#mote)"/>
    <circle cx="292" cy="282" r="5" fill="url(#mote)"/><circle cx="68" cy="282" r="5" fill="url(#mote)"/>
  </g>

  <!-- Radiating qi rays -->
  <g stroke="#9fe3c2" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <line x1="180" y1="34" x2="180" y2="58"/><line x1="180" y1="286" x2="180" y2="310"/>
    <line x1="50" y1="172" x2="74" y2="172"/><line x1="286" y1="172" x2="310" y2="172"/>
    <line x1="88" y1="80" x2="104" y2="96"/><line x1="272" y1="80" x2="256" y2="96"/>
    <line x1="88" y1="264" x2="104" y2="248"/><line x1="272" y1="264" x2="256" y2="248"/>
  </g>

  <!-- Ornate double ring -->
  <circle cx="180" cy="172" r="150" fill="none" stroke="url(#ring)" stroke-width="7"/>
  <circle cx="180" cy="172" r="138" fill="none" stroke="#e7c878" stroke-width="1.5" opacity="0.55"/>
  <circle cx="180" cy="172" r="160" fill="none" stroke="#c8a24a" stroke-width="1" opacity="0.4" stroke-dasharray="3 9"/>
  <!-- Ruyi cloud motifs at the 4 cardinals -->
  <g fill="#e7c878">
    <g transform="translate(180 22)"><path d="M-12 0 q4 -8 12 -8 q8 0 12 8 q-6 -3 -12 1 q-6 -4 -12 -1 Z"/></g>
    <g transform="translate(180 322) rotate(180)"><path d="M-12 0 q4 -8 12 -8 q8 0 12 8 q-6 -3 -12 1 q-6 -4 -12 -1 Z"/></g>
    <g transform="translate(30 172) rotate(-90)"><path d="M-12 0 q4 -8 12 -8 q8 0 12 8 q-6 -3 -12 1 q-6 -4 -12 -1 Z"/></g>
    <g transform="translate(330 172) rotate(90)"><path d="M-12 0 q4 -8 12 -8 q8 0 12 8 q-6 -3 -12 1 q-6 -4 -12 -1 Z"/></g>
  </g>
  <!-- stud dots -->
  <g fill="#c8a24a">
    <circle cx="291" cy="63" r="3.4"/><circle cx="69" cy="63" r="3.4"/><circle cx="291" cy="281" r="3.4"/><circle cx="69" cy="281" r="3.4"/>
  </g>

  <!-- Lotus base -->
  <g opacity="0.95">
    <ellipse cx="180" cy="292" rx="92" ry="14" fill="#4a8a6f" opacity="0.5" filter="url(#glow)"/>
    <g fill="#6fb594"><path d="M180 290 q-50 -6 -84 16 q44 24 84 8 q40 16 84 -8 q-34 -22 -84 -16 Z"/></g>
    <g fill="#8fd0ad"><path d="M180 284 q-28 -4 -48 12 q24 14 48 6 q24 8 48 -6 q-20 -16 -48 -12 Z"/></g>
    <path d="M180 286 q-10 -16 0 -30 q10 14 0 30 Z" fill="#bff7da"/>
  </g>

  <!-- Seated cultivator -->
  <g fill="url(#robe)" stroke="#16201b" stroke-width="1.5">
    <path d="M110 272 Q118 232 180 226 Q242 232 250 272 Q236 286 180 288 Q124 286 110 272 Z"/>
    <path d="M136 248 Q130 174 180 148 Q230 174 224 248 Q200 264 180 264 Q160 264 136 248 Z"/>
    <path d="M136 232 Q150 254 180 252 Q210 254 224 232 Q210 248 180 248 Q150 248 136 232 Z" fill="#2a3d35"/>
  </g>
  <!-- robe highlight + sash -->
  <path d="M150 176 Q160 220 156 250" stroke="#5e7a68" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M150 238 Q180 248 210 238 L206 252 Q180 260 154 252 Z" fill="#c8a24a" opacity="0.7"/>
  <!-- collar -->
  <path d="M152 178 Q180 160 208 178 L196 196 L180 188 L164 196 Z" fill="#546b5d"/>

  <!-- Head + topknot -->
  <circle cx="180" cy="130" r="26" fill="#ecdfc6" stroke="#16201b" stroke-width="1.5"/>
  <ellipse cx="180" cy="104" rx="11" ry="9" fill="#2a221b"/>
  <path d="M168 112 Q180 92 192 112 Q186 104 180 104 Q174 104 168 112 Z" fill="#2a221b"/>
  <circle cx="180" cy="98" r="4" fill="#c8a24a"/>
  <g stroke="#3a3128" stroke-width="2" stroke-linecap="round"><path d="M168 130 q5 4 10 0"/><path d="M182 130 q5 4 10 0"/></g>

  <!-- Glowing dantian core -->
  <circle cx="180" cy="214" r="30" fill="url(#dantian)"/>
  <circle cx="180" cy="214" r="9" fill="#ffffff"/>
  <g stroke="#fff2c4" stroke-width="2" opacity="0.7" stroke-linecap="round">
    <line x1="180" y1="190" x2="180" y2="198"/><line x1="180" y1="230" x2="180" y2="238"/>
    <line x1="156" y1="214" x2="164" y2="214"/><line x1="196" y1="214" x2="204" y2="214"/>
  </g>
</svg>
