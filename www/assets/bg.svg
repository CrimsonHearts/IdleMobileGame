<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0c0a07"/>
      <stop offset="0.35" stop-color="#15110c"/>
      <stop offset="0.7" stop-color="#1c1610"/>
      <stop offset="1"   stop-color="#241c14"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#f3e8c6" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#e7d4a0" stop-opacity="0.35"/>
      <stop offset="1"   stop-color="#e7d4a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#f6efd9"/>
      <stop offset="0.8" stop-color="#e6d6ac"/>
      <stop offset="1" stop-color="#d8c596"/>
    </radialGradient>
    <!-- Soft mist -->
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9e2dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d9e2dc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d9e2dc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1080" height="1920" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#f3e8c6">
    <circle cx="140" cy="180" r="2" opacity="0.7"/>
    <circle cx="300" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="520" cy="240" r="2" opacity="0.6"/>
    <circle cx="940" cy="160" r="1.6" opacity="0.6"/>
    <circle cx="1000" cy="320" r="2.2" opacity="0.5"/>
    <circle cx="220" cy="360" r="1.4" opacity="0.45"/>
    <circle cx="680" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="430" cy="60" r="1.3" opacity="0.4"/>
  </g>

  <!-- Moon -->
  <circle cx="770" cy="380" r="300" fill="url(#moonGlow)"/>
  <circle cx="770" cy="380" r="135" fill="url(#moonBody)"/>
  <circle cx="730" cy="345" r="22" fill="#d8c596" opacity="0.35"/>
  <circle cx="800" cy="420" r="14" fill="#d8c596" opacity="0.3"/>
  <circle cx="812" cy="350" r="10" fill="#d8c596" opacity="0.25"/>

  <!-- Cranes near the moon -->
  <g stroke="#efe6cf" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M560 300 q22 -18 44 0 q22 -18 44 0"/>
    <path d="M620 250 q16 -13 32 0 q16 -13 32 0"/>
    <path d="M512 360 q13 -11 26 0 q13 -11 26 0"/>
  </g>

  <!-- Mountain range: far (misty, light) -->
  <path d="M0 760
           C 120 700, 220 730, 320 690
           C 430 645, 520 705, 640 670
           C 760 635, 880 700, 1000 660
           C 1040 648, 1060 660, 1080 655
           L1080 1920 L0 1920 Z"
        fill="#46544f" opacity="0.32"/>

  <!-- mist band 1 -->
  <ellipse cx="540" cy="800" rx="760" ry="60" fill="url(#mist)" filter="url(#blur)" opacity="0.7"/>

  <!-- Mountain range: mid-far -->
  <path d="M0 950
           C 140 870, 260 910, 360 850
           C 470 785, 560 860, 680 815
           C 790 775, 900 850, 1010 800
           C 1045 785, 1065 800, 1080 795
           L1080 1920 L0 1920 Z"
        fill="#3a4842" opacity="0.5"/>

  <!-- Pagoda on the mid-far ridge -->
  <g transform="translate(835 768)" fill="#2a3530" opacity="0.85">
    <rect x="-4" y="-70" width="8" height="70"/>
    <polygon points="-30,-58 30,-58 20,-70 -20,-70"/>
    <rect x="-18" y="-58" width="36" height="16"/>
    <polygon points="-34,-40 34,-40 22,-58 -22,-58"/>
    <rect x="-22" y="-40" width="44" height="18"/>
    <polygon points="-40,-20 40,-20 26,-40 -26,-40"/>
    <rect x="-26" y="-20" width="52" height="20"/>
    <circle cx="0" cy="-78" r="5"/>
  </g>

  <!-- mist band 2 -->
  <ellipse cx="540" cy="1000" rx="820" ry="70" fill="url(#mist)" filter="url(#blur)" opacity="0.65"/>

  <!-- Mountain range: mid (taller jagged peaks) -->
  <path d="M0 1230
           C 110 1130, 180 1180, 250 1060
           C 320 940, 380 1110, 470 1030
           C 560 950, 610 1140, 720 1050
           C 820 970, 880 1150, 980 1070
           C 1030 1030, 1060 1090, 1080 1075
           L1080 1920 L0 1920 Z"
        fill="#2c3830" opacity="0.7"/>

  <!-- mist band 3 -->
  <ellipse cx="520" cy="1290" rx="900" ry="80" fill="url(#mist)" filter="url(#blur)" opacity="0.6"/>

  <!-- Mountain range: near -->
  <path d="M0 1560
           C 120 1440, 220 1520, 330 1400
           C 430 1290, 520 1500, 650 1410
           C 770 1330, 860 1520, 980 1430
           C 1030 1395, 1060 1450, 1080 1440
           L1080 1920 L0 1920 Z"
        fill="#202a24" opacity="0.86"/>

  <!-- Pine trees on the near ridge -->
  <g fill="#161d18">
    <g transform="translate(150 1470)">
      <rect x="-3" y="0" width="6" height="60"/>
      <polygon points="0,-70 -34,10 34,10"/>
      <polygon points="0,-40 -26,30 26,30"/>
    </g>
    <g transform="translate(235 1500) scale(0.8)">
      <rect x="-3" y="0" width="6" height="60"/>
      <polygon points="0,-70 -34,10 34,10"/>
      <polygon points="0,-40 -26,30 26,30"/>
    </g>
    <g transform="translate(905 1455) scale(1.1)">
      <rect x="-3" y="0" width="6" height="60"/>
      <polygon points="0,-70 -34,10 34,10"/>
      <polygon points="0,-40 -26,30 26,30"/>
    </g>
  </g>

  <!-- Foreground darkest mass -->
  <path d="M0 1760
           C 160 1690, 320 1740, 480 1700
           C 640 1660, 800 1740, 960 1700
           C 1010 1688, 1050 1710, 1080 1705
           L1080 1920 L0 1920 Z"
        fill="#12100b"/>

  <!-- low foreground mist -->
  <ellipse cx="540" cy="1620" rx="950" ry="80" fill="url(#mist)" filter="url(#blurSoft)" opacity="0.4"/>
</svg>
