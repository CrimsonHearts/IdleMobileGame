<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <clipPath id="cF"><circle cx="180" cy="180" r="176"/></clipPath>
    <radialGradient id="bgF" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#fdeff4"/><stop offset="0.6" stop-color="#f6e6ec"/><stop offset="1" stop-color="#ead7e0"/>
    </radialGradient>
    <linearGradient id="hairF" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4a352f"/><stop offset="1" stop-color="#2c1f1c"/>
    </linearGradient>
    <linearGradient id="skinF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe0cf"/><stop offset="1" stop-color="#f3cbb4"/>
    </linearGradient>
    <linearGradient id="robeF2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fc190"/><stop offset="1" stop-color="#1f9e72"/>
    </linearGradient>
    <radialGradient id="irisF" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7fd9b6"/><stop offset="0.6" stop-color="#2f9f78"/><stop offset="1" stop-color="#1d6e52"/>
    </radialGradient>
    <radialGradient id="gemF" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" /><stop offset="0.5" stop-color="#7fe9c4"/><stop offset="1" stop-color="#1f9e72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#cF)">
    <rect width="360" height="360" fill="url(#bgF)"/>
    <circle cx="180" cy="150" r="120" fill="#ffffff" opacity="0.35"/>

    <!-- Hair (back, long) -->
    <path d="M92 175 Q86 84 180 76 Q274 84 268 175 L274 360 L232 360 Q236 286 214 250 Q236 300 196 320 L164 320 Q124 300 146 250 Q124 286 128 360 L86 360 Z" fill="url(#hairF)"/>

    <!-- Shoulders / modern hanfu jacket -->
    <path d="M96 360 Q104 282 168 266 L180 292 L192 266 Q256 282 264 360 Z" fill="url(#robeF2)"/>
    <path d="M150 360 Q156 320 150 300 M210 360 Q204 320 210 300" stroke="#15835d" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- collar trim -->
    <path d="M150 286 L180 322 L210 286" stroke="#f1d79e" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <path d="M150 286 L180 322 L210 286" stroke="#fff" stroke-width="2" fill="none" stroke-linejoin="round" opacity="0.5"/>

    <!-- Neck -->
    <path d="M163 244 L163 286 Q180 298 197 286 L197 244 Z" fill="url(#skinF)"/>
    <path d="M163 250 Q180 268 197 250 L197 258 Q180 274 163 258 Z" fill="#e3b79c" opacity="0.5"/>

    <!-- Face -->
    <path d="M120 152 Q120 100 180 94 Q240 100 240 152 Q240 196 206 214 Q180 226 154 214 Q120 196 120 152 Z" fill="url(#skinF)"/>
    <!-- ears -->
    <ellipse cx="122" cy="158" rx="11" ry="15" fill="url(#skinF)"/><ellipse cx="238" cy="158" rx="11" ry="15" fill="url(#skinF)"/>
    <circle cx="120" cy="160" r="3.5" fill="#e9b6c9"/><circle cx="240" cy="160" r="3.5" fill="#e9b6c9"/>

    <!-- Blush -->
    <ellipse cx="147" cy="176" rx="13" ry="7" fill="#f4a6bf" opacity="0.4"/>
    <ellipse cx="213" cy="176" rx="13" ry="7" fill="#f4a6bf" opacity="0.4"/>

    <!-- Eyebrows -->
    <path d="M137 135 Q152 129 167 134" stroke="#3a2820" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M193 134 Q208 129 223 135" stroke="#3a2820" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Eyes -->
    <g>
      <ellipse cx="152" cy="153" rx="15" ry="12" fill="#fff"/>
      <circle cx="154" cy="154" r="10" fill="url(#irisF)"/><circle cx="154" cy="154" r="4.5" fill="#241c1f"/>
      <circle cx="150" cy="149" r="3.6" fill="#fff"/><circle cx="158" cy="158" r="1.7" fill="#fff" opacity="0.85"/>
      <path d="M136 147 Q152 137 169 148" stroke="#2a1f22" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M136 147 q-4 -2 -7 -6" stroke="#2a1f22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
    <g>
      <ellipse cx="208" cy="153" rx="15" ry="12" fill="#fff"/>
      <circle cx="206" cy="154" r="10" fill="url(#irisF)"/><circle cx="206" cy="154" r="4.5" fill="#241c1f"/>
      <circle cx="202" cy="149" r="3.6" fill="#fff"/><circle cx="210" cy="158" r="1.7" fill="#fff" opacity="0.85"/>
      <path d="M191 148 Q208 137 224 147" stroke="#2a1f22" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <path d="M224 147 q4 -2 7 -6" stroke="#2a1f22" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nose + mouth -->
    <path d="M178 162 Q175 171 181 172" stroke="#e0a98f" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M170 188 Q180 195 190 188" stroke="#c25b73" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M174 189 Q180 192 186 189" fill="#e98aa0" opacity="0.6"/>

    <!-- Front hair: bangs + side locks -->
    <path d="M116 156 Q104 92 180 84 Q256 92 244 156 Q252 116 214 104
             Q206 128 200 140 Q196 108 180 106 Q164 108 160 140
             Q154 128 146 104 Q108 116 116 156 Z" fill="url(#hairF)"/>
    <path d="M120 150 Q128 110 150 100" stroke="#5e453d" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M240 150 Q232 110 210 100" stroke="#5e453d" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round"/>
    <!-- side locks down the cheeks -->
    <path d="M120 150 Q110 210 122 250 Q132 214 128 156 Z" fill="url(#hairF)"/>
    <path d="M240 150 Q250 210 238 250 Q228 214 232 156 Z" fill="url(#hairF)"/>

    <!-- Hairpin (gold + jade flower) -->
    <g transform="translate(214 110)">
      <line x1="0" y1="0" x2="24" y2="-10" stroke="#e7c878" stroke-width="3" stroke-linecap="round"/>
      <circle cx="26" cy="-11" r="6" fill="#f4a6bf"/><circle cx="26" cy="-11" r="2.5" fill="#fff"/>
    </g>

    <!-- Glowing dao gem on collar -->
    <circle cx="180" cy="300" r="16" fill="url(#gemF)"/>
    <circle cx="180" cy="300" r="4" fill="#fff"/>
  </g>

  <!-- Frame ring -->
  <circle cx="180" cy="180" r="176" fill="none" stroke="#e7c878" stroke-width="3"/>
  <circle cx="180" cy="180" r="170" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
</svg>
