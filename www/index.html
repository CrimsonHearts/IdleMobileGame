    <symbol id="ic-fox" viewBox="0 0 100 100" fill="currentColor">

  <div id="app" data-realm="0">

    <!-- Per-realm atmospheric backdrop (painted vista + themed gradient + drifting motes) -->
    <div id="realm-backdrop"><div id="realm-vista"></div></div>

    <!-- Top bar: H1 Parchment -->
    <header id="topbar">
      <div class="tb-row1">
        <img class="avatar" id="avatar-img" src="assets/cultivator.svg" alt="" draggable="false"/>
        <div class="topbar-id">
          <div class="char-name-row">
            <span id="char-name">Cultivator</span>
            <span class="root-chip" id="char-root">Mortal Root</span>
          </div>
          <div class="realm-line"><span id="realm-name">Mortal</span> · <span id="stage-name">Mortal Body</span></div>
        </div>
        <div class="age-badge">Age <b id="age-val">18/80</b> · Gen <b id="gen-val">1</b></div>
      </div>
      <div class="tb-res">
        <div class="res-chip">
          <span class="res-ico">☯</span>
          <div class="res-vals"><b id="qi-amount">0</b><small id="qps">0/s</small></div>
        </div>
        <div class="res-chip">
          <span class="res-ico">¥</span>
          <div class="res-vals"><b id="money-amount">0</b><small id="mps" style="display:none"></small></div>
        </div>
        <div class="res-chip" id="shards-chip" style="display:none">
          <span class="res-ico">💎</span>
          <div class="res-vals"><b id="res-shards">0</b><small>Shards</small></div>
        </div>
        <div class="res-chip" id="cult-bonus-wrap" style="cursor:pointer" title="Tap to see breakdown">
          <span class="res-ico">⚡</span>
          <div class="res-vals"><b>+<span id="cb-bonus">0</span>%</b><small>Cultivation</small></div>
        </div>
      </div>
      <b id="dao-amount" style="display:none">0</b>
    </header>

    <!-- Tab content -->
    <main id="content">

      <!-- ===== CULTIVATE ===== -->
      <section class="tab-panel active" id="tab-cultivate">

        <!-- Stage: hero + FABs + progress overlay at bottom -->
        <div id="cultivate-stage">
          <div class="stage-fabs stage-fabs-l">
            <button id="quest-btn" class="fab-btn qa-btn qa-quest">
              <span class="fab-ico">📜</span>
              <span class="fab-lbl">Quests</span>
              <span id="quest-badge" class="quest-badge" style="display:none"></span>
            </button>
            <button class="fab-btn" id="boost-qi-btn">
              <span class="fab-ico">📺</span>
              <span class="fab-lbl" id="boost-qi-status">2× Boost</span>
            </button>
            <button class="fab-btn" id="chronicle-btn">
              <span class="fab-ico">📖</span>
              <span class="fab-lbl">Story</span>
            </button>
          </div>

          <div id="tap-zone">
            <button id="meditate-btn">
              <img class="tap-emblem" id="tap-emblem" src="assets/cultivator.svg" alt="Meditating cultivator" draggable="false"/>
              <span class="tap-label">Meditate</span>
              <span class="tap-gain" id="tap-gain">+1</span>
            </button>
            <div id="focus-combo" style="display:none">
              <div class="progress-track"><div id="focus-combo-fill"></div></div>
              <span id="focus-combo-label">Focus x1</span>
            </div>
          </div>

          <div class="stage-fabs stage-fabs-r">
            <button id="shop-btn" class="fab-btn qa-btn qa-shop">
              <span class="fab-ico">🛒</span>
              <span class="fab-lbl">Shop</span>
            </button>
            <button id="daily-btn" class="fab-btn qa-btn qa-daily">
              <span class="fab-ico">🎁</span>
              <span class="fab-lbl">Daily</span>
              <span id="daily-badge" class="quest-badge" style="display:none">!</span>
            </button>
            <button class="fab-btn" id="boost-stage-btn">
              <span class="fab-ico">⬆</span>
              <span class="fab-lbl ad-boost-sub">Stage Aid</span>
            </button>
          </div>

          <!-- Progress overlay: always shows bar+label; buttons appear only when ready -->
          <section id="realm-progress">
            <div class="rp-bar-row">
              <div class="progress-track"><div id="realm-progress-fill"></div></div>
              <span id="realm-progress-label">0 / 1.00K Qi</span>
            </div>
            <p id="breakthrough-info"></p>
            <button id="advance-btn" style="display:none">⬆ Minor Breakthrough</button>
            <button id="breakthrough-btn" style="display:none" disabled>⚡ Heavenly Tribulation</button>
          </section>
        </div>

        <!-- Generators: compact header + list -->
        <div id="cultivate-list">
          <div class="cultivate-header">
            <span class="cul-title">⛩ Grounds</span>
            <div id="synergy-banner" class="synergy-banner" style="display:none"></div>
            <div class="buy-amount-row">
              <button class="buy-amount-btn active" data-amount="1">×1</button>
              <button class="buy-amount-btn" data-amount="5">×5</button>
              <button class="buy-amount-btn" data-amount="max">MAX</button>
            </div>
          </div>
          <div id="shop-list"></div>
        </div>
      </section>

      <!-- ===== STUDY ===== -->
      <section class="tab-panel" id="tab-study"></section>

      <!-- ===== WORK ===== -->
      <section class="tab-panel" id="tab-work"></section>

      <!-- ===== LIFE (romance + family + lineage) ===== -->
      <section class="tab-panel" id="tab-life">
        <div class="subnav" id="life-subnav">
          <button class="subnav-btn active" data-lsub="partner">💕 Partner</button>
          <button class="subnav-btn" data-lsub="lineage">🏛 Lineage</button>
        </div>
        <div class="subpanel active" id="lsub-partner"></div>
        <div class="subpanel" id="lsub-lineage"></div>
      </section>

      <!-- ===== ARTS (Techniques + Meridians) ===== -->
      <section class="tab-panel" id="tab-techniques">
        <div class="subnav" id="arts-subnav">
          <button class="subnav-btn active" data-asub="techniques">📜 Techniques</button>
          <button class="subnav-btn" data-asub="meridians">🧬 Meridians</button>
          <button class="subnav-btn" data-asub="blood">🩸 Blood</button>
          <button class="subnav-btn" data-asub="spirit">🌌 Spirit</button>
          <button class="subnav-btn" data-asub="heaven">☁️ Heaven</button>
          <button class="subnav-btn" data-asub="alchemy">⚗️ Alchemy</button>
        </div>
        <div class="subpanel active" id="asub-techniques">
          <div class="section-title">📜 Techniques & Manuals</div>
          <div id="upgrade-list"></div>
        </div>
        <div class="subpanel" id="asub-meridians"></div>
        <div class="subpanel" id="asub-blood"></div>
        <div class="subpanel" id="asub-spirit"></div>
        <div class="subpanel" id="asub-heaven"></div>
        <div class="subpanel" id="asub-alchemy"></div>
      </section>

      <!-- ===== WORLD (Trials / Beasts / Sect hub) ===== -->
      <section class="tab-panel" id="tab-world">
        <div class="subnav" id="world-subnav">
          <button class="subnav-btn active" data-sub="trials">⚔️ Trials</button>
          <button class="subnav-btn" data-sub="beasts">🐉 Beasts</button>
          <button class="subnav-btn" data-sub="skills">📜 Skills</button>
          <button class="subnav-btn" data-sub="sect">🏯 Sect</button>
          <button class="subnav-btn" data-sub="gear">⚜️ Gear</button>
          <button class="subnav-btn" data-sub="market">🏪 Market</button>
          <button class="subnav-btn" data-sub="realm">🌀 Realm</button>
          <button class="subnav-btn" data-sub="boosters">⚡ Boost</button>
          <button class="subnav-btn" data-sub="feats">🏆 Feats</button>
          <button class="subnav-btn" data-sub="dailies">📋 Dailies</button>
          <button class="subnav-btn" data-sub="fracture">🌌 Fracture</button>
        </div>
        <div class="subpanel active" id="sub-trials"></div>
        <div class="subpanel" id="sub-beasts"></div>
        <div class="subpanel" id="sub-skills"></div>
        <div class="subpanel" id="sub-sect"></div>
        <div class="subpanel" id="sub-gear"></div>
        <div class="subpanel" id="sub-market"></div>
        <div class="subpanel" id="sub-realm"></div>
        <div class="subpanel" id="sub-boosters"></div>
        <div class="subpanel" id="sub-feats"></div>
        <div class="subpanel" id="sub-dailies"></div>
        <div class="subpanel" id="sub-fracture"></div>
      </section>

    </main>

    <!-- Bottom navigation: N3 icon-only frosted -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-tab="cultivate"><span class="nav-ico">🧘</span></button>
      <button class="nav-btn" data-tab="study"><span class="nav-ico">🎓</span></button>
      <button class="nav-btn" data-tab="work"><span class="nav-ico">💼</span></button>
      <button class="nav-btn" data-tab="life"><span class="nav-ico">❤️</span></button>
      <button class="nav-btn" data-tab="world"><span class="nav-ico">⚔️</span></button>
      <button class="nav-btn" data-tab="techniques"><span class="nav-ico">📜</span></button>
    </nav>

  </div>

  <!-- Scripts: order matters -->
  <script src="js/quests.js"></script>
  <script src="js/numbers.js"></script>
  <script src="js/gameData.js"></script>

  <script src="js/combat.js"></script>
  <script src="js/events.js"></script>

  <script src="js/challenges.js"></script>

  <script src="js/market.js"></script>

  <script src="js/ui.js"></script>
  <script src="js/onboarding.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
