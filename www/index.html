<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <title>仙途 · Path to Immortality</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Inline icon sprite (xianxia gold line-art). Referenced via <use href="#ic-…">. -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
    <symbol id="ic-mat" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
      <ellipse cx="50" cy="64" rx="36" ry="16"/><ellipse cx="50" cy="58" rx="36" ry="16"/>
      <path d="M30 52 q20 -14 40 0"/><circle cx="50" cy="46" r="4" fill="currentColor"/><path d="M50 50 v6"/>
    </symbol>
    <symbol id="ic-herb" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 84 V40"/><path d="M50 56 Q24 50 22 26 Q46 28 50 52"/><path d="M50 48 Q76 42 78 18 Q54 20 50 44"/>
      <circle cx="50" cy="30" r="3.5" fill="currentColor" stroke="none"/><path d="M38 86 h24"/>
    </symbol>
    <symbol id="ic-stone" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
      <polygon points="50,14 78,40 62,86 38,86 22,40"/><path d="M22 40 H78"/><path d="M50 14 V86"/><path d="M50 14 L38 40 M50 14 L62 40"/>
    </symbol>
    <symbol id="ic-furnace" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M26 44 Q26 74 50 74 Q74 74 74 44 Z"/><path d="M20 44 H80"/>
      <path d="M30 44 Q30 30 22 28 M70 44 Q70 30 78 28"/><path d="M34 74 V84 M66 74 V84 M50 74 V86"/>
      <path d="M44 24 q6 -8 0 -14 M56 24 q6 -8 0 -14" opacity="0.8"/>
    </symbol>
    <symbol id="ic-library" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="28" y="20" width="44" height="60" rx="3"/><path d="M28 28 q-10 -4 -10 6 q0 8 10 6 M72 28 q10 -4 10 6 q0 8 -10 6"/>
      <path d="M38 40 H62 M38 52 H62 M38 64 H54"/>
    </symbol>
    <symbol id="ic-sword" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 12 L50 66"/><path d="M44 16 L50 12 L56 16 L56 60 Q50 70 44 60 Z"/><path d="M36 68 H64"/><path d="M50 68 V84"/><circle cx="50" cy="88" r="4"/>
    </symbol>
    <symbol id="ic-array" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round">
      <circle cx="50" cy="50" r="36"/><circle cx="50" cy="50" r="24"/><polygon points="50,22 74,64 26,64"/>
      <polygon points="50,78 26,36 74,36" opacity="0.7"/><circle cx="50" cy="50" r="5" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="ic-dragon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 78 Q34 60 26 46 Q20 34 36 30 Q52 26 50 40 Q48 52 60 50 Q74 48 72 34"/>
      <path d="M72 34 Q72 24 82 24 Q78 30 84 32"/><circle cx="74" cy="30" r="2.5" fill="currentColor" stroke="none"/>
      <path d="M36 30 q-8 -6 -14 -2 M50 40 q-6 -8 -14 -8" opacity="0.7"/><path d="M26 46 q-8 2 -10 10 M18 78 q-6 2 -8 8" opacity="0.7"/>
    </symbol>
    <symbol id="ic-star" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="50,16 56,34 74,34 60,46 65,64 50,52 35,64 40,46 26,34 44,34"/>
      <path d="M28 74 H72 M22 84 H78"/><path d="M34 74 V84 M50 74 V84 M66 74 V84"/>
    </symbol>
    <symbol id="ic-heaven" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 28 Q42 48 50 62 Q58 48 50 28 Z"/><path d="M50 62 Q30 40 24 50 Q26 64 50 64 Z"/><path d="M50 62 Q70 40 76 50 Q74 64 50 64 Z"/>
      <path d="M50 64 Q34 56 22 64 Q34 76 50 70 Z" opacity="0.85"/><path d="M50 64 Q66 56 78 64 Q66 76 50 70 Z" opacity="0.85"/><path d="M30 78 Q50 70 70 78"/>
    </symbol>
  </svg>

  <div id="app">

    <!-- Top status bar -->
    <header id="topbar">
      <div class="realm-block">
        <div class="realm-label">Realm</div>
        <div class="realm-names">
          <span id="realm-name">Mortal</span>
          <span id="realm-name-cn">凡人</span>
        </div>
      </div>
      <div class="dao-block">
        <div class="dao-label">道韵 Dao</div>
        <div class="dao-value"><span id="dao-amount">0</span> ☯</div>
      </div>
    </header>

    <!-- Primary resource -->
    <section id="resource-bar">
      <div class="qi-amount"><span id="qi-amount">0</span> <span class="qi-icon">☯</span></div>
      <div class="qi-rate"><span id="qps">0/s</span></div>
    </section>

    <!-- Realm progress -->
    <section id="realm-progress">
      <div class="progress-track"><div id="realm-progress-fill"></div></div>
      <div id="realm-progress-label">0 / 1.00K Qi</div>
      <p id="breakthrough-info"></p>
      <button id="breakthrough-btn" disabled>⚡ Break Through (天劫)</button>
    </section>

    <!-- Meditate tap -->
    <section id="tap-zone">
      <button id="meditate-btn">
        <img class="tap-emblem" src="assets/cultivator.svg" alt="Meditating cultivator" draggable="false" />
        <span class="tap-label">Meditate 打坐</span>
        <span class="tap-gain" id="tap-gain">+1</span>
      </button>
    </section>

    <!-- Tabs -->
    <nav id="tabs">
      <button class="tab-btn active" data-tab="shop">⛩ Cultivate</button>
      <button class="tab-btn" data-tab="upgrades">📜 Techniques</button>
    </nav>

    <!-- Panels -->
    <main id="panels">
      <section class="panel active" id="panel-shop">
        <div class="buy-amount-row">
          <span>Buy:</span>
          <button class="buy-amount-btn active" data-amount="1">×1</button>
          <button class="buy-amount-btn" data-amount="10">×10</button>
          <button class="buy-amount-btn" data-amount="max">MAX</button>
        </div>
        <div id="shop-list"></div>
      </section>

      <section class="panel" id="panel-upgrades">
        <div id="upgrade-list"></div>
      </section>
    </main>

  </div>

  <!-- Scripts: order matters -->
  <script src="js/numbers.js"></script>
  <script src="js/gameData.js"></script>
  <script src="js/time.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/monetization.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
